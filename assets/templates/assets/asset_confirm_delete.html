
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Delete Asset</title>
</head>
<body>

    <h1>IT Asset Management System</h1>
    <h2>Confirm Asset Deletion</h2>

    <p>Are you sure you want to delete this asset?</p>

    <p>
        <strong>Asset Tag:</strong> {{ asset.asset_tag }}
    </p>

    <p>
        <strong>Asset Name:</strong> {{ asset.asset_name }}
    </p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">Yes, Delete Asset</button>
    </form>

    <br>

    <a href="{% url 'asset_list' %}">Cancel</a>

</body>
</html>
